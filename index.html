<!DOCTYPE html>
<html>
<head>
    <title>Jericho Studio Dashboard</title>
    <style>
        body { font-family: system-ui; background: #121212; color: #fff; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #0056b3; }
        button:disabled { background: #555; cursor: not-allowed; }
        .image-gallery img { height: 180px; border-radius: 4px; border: 2px solid #555; margin-right: 10px; }
        .script-box { background: #000; padding: 10px; font-family: monospace; border-left: 3px solid #007bff; margin: 10px 0; }
        #log { color: #aaa; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🎬 Jericho Studio Director's Dashboard</h1>
    
    <div class="panel">
        <h2>1. Simulation Engine</h2>
        
        <div class="flex" style="margin-bottom: 15px; align-items: center;">
            <select id="gameSelect" style="padding: 10px; border-radius: 4px; background: #333; color: white; border: 1px solid #555;">
                <option value="">Loading games...</option>
            </select>
            
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="chkClearDb" style="width: 18px; height: 18px; cursor: pointer;">
                <span style="color: #ff6b6b; font-weight: bold;">Wipe previous save (Start Fresh)</span>
            </label>
        </div>

        <div class="flex">
            <button id="btnStart" onclick="startGame()">Start Game</button>
            <button id="btnStep" onclick="stepGame(1)" disabled>Simulate 1 Turn</button>
            <button id="btnStep5" onclick="stepGame(5)" disabled>Simulate 5 Turns</button>
        </div>
        <p id="simStatus" style="margin-top: 15px;">Status: Awaiting game start...</p>
    </div>
        <p id="simStatus">Status: Awaiting game start...</p>
    </div>

    <div class="panel">
        <h2>2. Pre-Production (MediaPipe Engine)</h2>
        <button id="btnCandidates" onclick="loadCandidates()" disabled>Generate Pre-Viz Candidates</button>
        <p id="log"></p>
        <div id="candidatesContainer"></div>
    </div>
    <div class="panel">
        <h2>3. The Director's Cut (Official Timeline)</h2>
        <p style="color: #aaa; font-size: 0.9em; margin-top: 0;">Pin rendered scenes to the timeline, then let the AI Narrator summarize them.</p>
        
        <div class="flex">
            <label for="recapCount" style="align-self: center;">Recap last:</label>
            <input type="number" id="recapCount" value="3" min="1" max="10" style="padding:10px; border-radius:4px; border:1px solid #555; background:#333; color:white; width: 60px;">
            <span style="align-self: center;">events</span>
            
            <button id="btnRecap" onclick="generateRecap(this)" disabled style="margin-left: 15px; background: #6f42c1;">
                🎙️ Generate "Previously On..." Recap
            </button>
        </div>
        
        <div id="recapContainer" style="margin-top: 20px;"></div>
    </div>
    <script>
        const API_BASE = "http://localhost:5000";
        let sessionId = "";
        let currentTick = 0;

        // NEW: Fetch games the moment the page opens
        window.onload = async function() {
            try {
                const res = await fetch(`${API_BASE}/games`);
                const data = await res.json();
                
                const select = document.getElementById("gameSelect");
                select.innerHTML = ""; // Clear the 'Loading...' text
                
                if (data.available_games.length === 0) {
                    select.innerHTML = `<option value="">No .z8 games found!</option>`;
                    document.getElementById("btnStart").disabled = true;
                    return;
                }

                data.available_games.forEach(game => {
                    select.innerHTML += `<option value="${game}">${game}</option>`;
                });
            } catch (e) { 
                document.getElementById("gameSelect").innerHTML = `<option value="">Error connecting to API</option>`;
            }
        };

        async function startGame() {
            const gameFile = document.getElementById("gameSelect").value;
            const clearDb = document.getElementById("chkClearDb").checked; // Get checkbox state
            
            if (!gameFile) return;

            document.getElementById("simStatus").innerText = "Status: Starting...";
            document.getElementById("btnStart").disabled = true; 

            try {
                const res = await fetch(`${API_BASE}/game/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Include the clear_db flag in the payload
                    body: JSON.stringify({ game_file: gameFile, clear_db: clearDb }) 
                });
                
                if (!res.ok) throw new Error("Failed to start");
                
                const data = await res.json();
                sessionId = data.session_id;
                currentTick = 0; // Reset tick counter visually
                
                document.getElementById("simStatus").innerText = `Status: Active (${gameFile}) | Session: ${sessionId.substring(0,8)}... | Tick: ${currentTick}`;
                document.getElementById("btnStep").disabled = false;
                document.getElementById("btnStep5").disabled = false;
                document.getElementById("btnCandidates").disabled = false;
                document.getElementById("btnRecap").disabled = false;
                
            } catch (e) { 
                alert("Failed to connect to server."); 
                document.getElementById("btnStart").disabled = false;
            }
        }

        async function stepGame(turns=1) {
            document.getElementById("simStatus").innerText = `Status: Simulating...`;
            for(let i=0; i<turns; i++) {
                const res = await fetch(`${API_BASE}/game/${sessionId}/step`, { method: 'POST' });
                const data = await res.json();
                currentTick = data.tick;
            }
            document.getElementById("simStatus").innerText = `Status: Active | Tick: ${currentTick}`;
        }

        async function loadCandidates() {
            const container = document.getElementById("candidatesContainer");
            const log = document.getElementById("log");
            
            document.getElementById("btnCandidates").disabled = true;
            log.innerText = "Generating backgrounds, agents, and running MediaPipe compositing... (Check terminal)";
            container.innerHTML = "";
            
            try {
                const res = await fetch(`${API_BASE}/game/${sessionId}/candidates`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({}) 
                });
                const data = await res.json();
                
                log.innerText = "Pre-Viz complete!";
                document.getElementById("btnCandidates").disabled = false;
                
                // Build the HTML as a single string first
                let finalHtml = "";
                
                data.candidates.forEach(scene => {
                    let imgTags = Object.values(scene.images).map(path => 
                        `<img src="${API_BASE}/${path.replace(/\\/g, '/')}" alt="Master Shot">`
                    ).join("");

                    let scriptTags = scene.script.map(line => 
                        `<div><b>${line.speaker}:</b> ${line.line}</div>`
                    ).join("");

                    // THE FIX: Escape any single quotes in the room name before putting it in the button
                    const safeRoomName = scene.room.replace(/'/g, "\\'");

                    finalHtml += `
                    <div class="panel" style="background:#222">
                        <h3>Room: ${scene.room} (Tick ${scene.tick}) | Drama Score: ${scene.score.toFixed(1)}</h3>
                        <div class="image-gallery">${imgTags}</div>
                        <div class="script-box">${scriptTags}</div>
                        
                        <div class="flex">
                            <button onclick="triggerRender(${scene.tick}, '${safeRoomName}', this)">🎬 Render Final Video</button>
                            <button onclick="addToTimeline(${scene.tick}, '${safeRoomName}', this)" style="background: #28a745;">📌 Add to Official Timeline</button>
                        </div>
                    </div>`;
                });
                
                // Inject the final string all at once
                container.innerHTML = finalHtml;
                
            } catch (error) {
                console.error("Error fetching candidates:", error);
                log.innerText = "❌ Failed to load candidates.";
                document.getElementById("btnCandidates").disabled = false;
            }
        }

        async function triggerRender(tick, room, btnElement) {
            // 1. Lock the button and show loading state
            btnElement.disabled = true;
            btnElement.innerText = "🎬 Initiating Render...";
            btnElement.style.background = "#555";

            try {
                // 2. Start the job on the backend
                const res = await fetch(`${API_BASE}/game/${sessionId}/render`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tick: tick, room: room })
                });
                
                const data = await res.json();
                const expectedFilename = data.video_filename;
                
                btnElement.innerText = "⏳ Rendering Video... (This takes a few minutes)";
                
                // 3. Start polling the server every 5 seconds
                const pollInterval = setInterval(async () => {
                    const statusRes = await fetch(`${API_BASE}/render_status/${expectedFilename}`);
                    const statusData = await statusRes.json();
                    
                    // 4. If done, kill the timer and inject the video player!
                    if (statusData.status === "done") {
                        clearInterval(pollInterval);
                        
                        const videoHtml = `
                            <div style="margin-top: 15px; background: #000; padding: 10px; border-radius: 8px; border: 2px solid #007bff;">
                                <h4 style="margin: 0 0 10px 0;">✅ Final Render Complete</h4>
                                <video width="100%" controls autoplay style="border-radius: 4px;">
                                    <source src="${API_BASE}${statusData.video_url}" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                            </div>
                        `;
                        // Replace the button entirely with the video player
                        btnElement.outerHTML = videoHtml;
                    }
                }, 5000); // 5000 milliseconds = 5 seconds

            } catch (error) {
                console.error("Error triggering render:", error);
                btnElement.innerText = "❌ Render Failed";
                btnElement.style.background = "#dc3545";
            }
        }
        
        async function addToTimeline(tick, room, btnElement) {
            btnElement.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/game/${sessionId}/timeline/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tick: tick, room: room })
                });
                
                if (res.ok) {
                    btnElement.innerText = "✅ Pinned to Canon";
                    btnElement.style.background = "#218838"; // Darker green for success
                } else {
                    btnElement.innerText = "⚠️ Already in Timeline";
                    btnElement.style.background = "#ffc107"; // Yellow for warning
                    btnElement.style.color = "#000";
                }
            } catch (error) {
                console.error("Timeline error:", error);
                btnElement.innerText = "❌ Failed to Pin";
                btnElement.style.background = "#dc3545";
            }
        }

        async function generateRecap(btnElement) {
            const pastN = document.getElementById("recapCount").value;
            const container = document.getElementById("recapContainer");
            
            // 1. Lock UI and prep
            btnElement.disabled = true;
            btnElement.innerText = "✍️ Writing & Filming Recap...";
            btnElement.style.background = "#555";
            container.innerHTML = "";

            try {
                // 2. Start Recap Job
                const res = await fetch(`${API_BASE}/game/${sessionId}/recap`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ past_n: parseInt(pastN) })
                });
                const data = await res.json();
                
                if (data.error) {
                    alert(data.error); // E.g., if the timeline is empty
                    btnElement.innerText = "🎙️ Generate 'Previously On...' Recap";
                    btnElement.disabled = false;
                    btnElement.style.background = "#6f42c1";
                    return;
                }

                const expectedFilename = data.video_filename;
                btnElement.innerText = "⏳ Rendering Narrator... (Takes a few minutes)";
                
                // 3. Poll for the final video (reusing our robust logic)
                const pollInterval = setInterval(async () => {
                    const statusRes = await fetch(`${API_BASE}/render_status/${expectedFilename}`);
                    const statusData = await statusRes.json();
                    
                    if (statusData.status === "done") {
                        clearInterval(pollInterval);
                        
                        // Reset button for future recaps
                        btnElement.innerText = "🎙️ Generate Another Recap";
                        btnElement.disabled = false;
                        btnElement.style.background = "#6f42c1";

                        // Inject the Video Player
                        container.innerHTML = `
                            <div style="background: #000; padding: 10px; border-radius: 8px; border: 2px solid #6f42c1;">
                                <h4 style="margin: 0 0 10px 0; color: #d63384;">📺 Latest Recap Episode</h4>
                                <video width="100%" controls autoplay style="border-radius: 4px;">
                                    <source src="${API_BASE}${statusData.video_url}" type="video/mp4">
                                </video>
                            </div>
                        `;
                    }
                }, 5000);
            } catch (error) {
                console.error("Recap Error:", error);
                btnElement.innerText = "❌ Recap Failed";
                btnElement.style.background = "#dc3545";
            }
        }
    </script>
</body>
</html>
